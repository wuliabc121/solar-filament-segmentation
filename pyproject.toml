[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3-filament"
version = "0.1.0"
description = "M3 solar filament instance segmentation and semantic fusion"
requires-python = ">=3.11,<3.12"

[project.scripts]
m3-filament = "m3_filament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
